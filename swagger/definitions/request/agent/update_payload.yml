type: object
required:
  - role
properties:
  role:
    type: string
    enum: ['agent', 'administrator']
    description: Whether its administrator or agent
    example: 'agent'
  availability:
    type: string
    enum: ['online', 'busy', 'offline']
    description: The configured availability of the agent.
    example: 'online'
  auto_offline:
    type: boolean
    description: Whether the agent is automatically marked offline when they are away.
    example: true
  active_chat_limit:
    type:
      - integer
      - 'null'
    description: Maximum open chats for this agent. Used only when active_chat_limit_enabled is true.
    example: 5
  active_chat_limit_enabled:
    type: boolean
    description: When true, the personal chat limit replaces account, inbox, and capacity limits.
    example: true
